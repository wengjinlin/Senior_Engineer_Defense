  <rect width="1360" height="720" fill="#ffffff"/>
  <text x="680" y="34" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">一张图看懂 sunny-multica harness</text>
  <text x="680" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">一条需求流水线（上） + 三个幕后支撑（中） + 三条铁律（下）· 人只在橙色两站出现</text>
  <rect x="40" y="100" width="1280" height="162" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="62" y="124" width="132" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
