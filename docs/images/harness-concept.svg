  <text x="128.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">+ 权限 SQL 草案</text>
  <rect x="218" y="124" width="132" height="104" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
