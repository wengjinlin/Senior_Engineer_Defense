  <text x="284.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">亲手执行</text>
  <text x="284.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">数据库脚本</text>
  <rect x="374" y="124" width="132" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440.0" y="150" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Tech-Lead</text>
  <text x="440.0" y="169" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">拆任务 · 排依赖</text>
  <text x="440.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">产出 plan.md</text>
  <text x="440.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">（写作计划 SOP）</text>
  <rect x="530" y="124" width="132" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="596.0" y="150" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Dev ⇄ Rev</text>
  <text x="596.0" y="169" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">程序员 TDD 写码</text>
  <text x="596.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">审查员只读把关</text>
  <text x="596.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">不过 → 打回返工</text>
  <rect x="686" y="124" width="132" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="752.0" y="150" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Tester</text>
  <text x="752.0" y="169" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">跑集成/边界测试</text>
  <text x="752.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">浏览器页面 QA</text>
  <text x="752.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">出测试报告</text>
  <rect x="842" y="124" width="132" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="908.0" y="150" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">DevOps</text>
  <text x="908.0" y="169" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">归档 · 打 tag</text>
  <text x="908.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">调 GitLab API</text>
  <text x="908.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">建 MR 待审</text>
  <rect x="998" y="124" width="132" height="104" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
  <text x="1064.0" y="150" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">人工门 ②</text>
  <text x="1064.0" y="169" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">人审 MR</text>
  <text x="1064.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">点合并</text>
  <text x="1064.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">（上线拍板）</text>
  <rect x="1154" y="124" width="132" height="104" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="1220.0" y="150" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">完成</text>
  <text x="1220.0" y="169" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">MR 合并后</text>
  <text x="1220.0" y="185" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">issue 自动关闭</text>
  <text x="1220.0" y="201" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">经验沉淀归档</text>
  <path d="M 196,176 L 216,176" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 352,176 L 372,176" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
