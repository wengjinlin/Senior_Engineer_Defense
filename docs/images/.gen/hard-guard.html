<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body { margin:0; padding:0; background:#ffffff; }</style></head>
<body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif; }</style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  </defs>
  <rect width="1240" height="800" fill="#ffffff"/>
  <text x="620.0" y="32" font-size="19" fill="#111827" text-anchor="middle" font-weight="600">硬约束体系 · 写入拦截与四道锁</text>
  <text x="620.0" y="56" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">规范不靠自觉靠拦截 —— 保护路径写入物理不可达 · 密钥永不落盘 · 变更有唯一合法通道</text>
  <rect x="90" y="104" width="200" height="76" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="190.0" y="128" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">agent 写入动作</text>
  <text x="190.0" y="145" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Write / Edit / Bash</text>
  <text x="190.0" y="160" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">（任何角色 · 每一次）</text>
  <path d="M 290,142 L 326,142" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue)"/>
  <rect x="330" y="104" width="190" height="76" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="425.0" y="128" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">PreToolUse hook</text>
  <text x="425.0" y="145" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">工具调用前触发</text>
  <text x="425.0" y="160" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">（Claude Code 钩子）</text>
  <path d="M 520,142 L 556,142" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue)"/>
  <polygon points="640,98 724,142 640,186 556,142" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="640" y="138" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600">命中保护</text>
  <text x="640" y="154" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600">路径清单？</text>
  <line x1="724" y1="142" x2="756" y2="142" stroke="#6b7280" stroke-width="1.6"/>
  <path d="M 756,142 L 756,116 L 786,116" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#red)"/>
  <text x="764" y="106" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="400">是</text>
  <rect x="790" y="84" width="400" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="990.0" y="108" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600">block · 拒绝执行（零违反）</text>
  <text x="990.0" y="125" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">写入根本发生不了 —— 物理不可绕过</text>
  <path d="M 756,142 L 756,176 L 786,176" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#green)"/>
  <text x="764" y="196" font-size="11" fill="#059669" text-anchor="middle" font-weight="400">否</text>
  <rect x="790" y="160" width="400" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="990.0" y="190.5" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600">放行 · 正常落盘</text>
  <path d="M 640,186 L 640,232 L 786,232" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="713" y="226" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">判定依据</text>
  <rect x="790" y="232" width="400" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="990.0" y="256" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="600">保护路径清单（示例）</text>
  <text x="990.0" y="273" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">application*.yml · db/ · sql/</text>
  <text x="990.0" y="288" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">settings.xml · pom.xml</text>
  <rect x="90" y="336" width="1100" height="70" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="640" y="360" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="600">变更保护路径的唯一合法通道（声明制，不是禁止制）</text>
  <text x="640" y="384" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">design.md 显式声明变更 → Reviewer 审查通过 → protected 路径另加人工复核 → 解锁变更</text>
  <rect x="90" y="436" width="262" height="118" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="221.0" y="462" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">① 开工必读</text>
  <text x="221.0" y="479" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">干活前强制读</text>
  <text x="221.0" y="494" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">CLAUDE.md + AGENTS.md</text>
  <text x="221.0" y="509" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">规范从「参考」变「前提」</text>
  <rect x="376" y="436" width="262" height="118" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="507.0" y="462" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">② 程序拦截</text>
  <text x="507.0" y="479" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">guard_write.py</text>
  <text x="507.0" y="494" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">PreToolUse 直接 block</text>
  <text x="507.0" y="509" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">零违反 · 不可绕过</text>
  <rect x="662" y="436" width="262" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="793.0" y="462" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">③ 只读审查</text>
  <text x="793.0" y="479" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">Reviewer 无写权限</text>
  <text x="793.0" y="494" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">quick 4 / full 10 关</text>
  <text x="793.0" y="509" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">想放水没有通道</text>
  <rect x="948" y="436" width="262" height="118" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1079.0" y="462" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">④ Git 铁律</text>
  <text x="1079.0" y="479" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">只 push feature/{change-id}</text>
  <text x="1079.0" y="494" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">禁直推保护分支</text>
  <text x="1079.0" y="509" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">上主线唯一路：MR 人审</text>
  <rect x="90" y="588" width="535" height="96" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="357" y="612" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="600">密钥管理 · env 人工通道</text>
  <text x="357" y="634" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">密码 / token 人工网页注入 · agent 仅进程内可读</text>
  <text x="357" y="654" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">永不落盘：不入脚本参数 · 不入 issue 评论 · 不入文档</text>
  <rect x="655" y="588" width="535" height="96" rx="8" fill="#f0f6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="922" y="612" font-size="12.5" fill="#1e40af" text-anchor="middle" font-weight="600">安装自测门（hook 自测）</text>
  <text x="922" y="634" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">保护路径写入 → 应被拦截；普通路径写入 → 应放行</text>
  <text x="922" y="654" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">两例全过才算装好 —— 建区完成的前置校验</text>
  <line x1="150" y1="730" x2="178" y2="730" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="186" y="734" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">蓝 · 调用链</text>
  <line x1="288" y1="730" x2="316" y2="730" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="324" y="734" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">红 · 拦截</text>
  <line x1="415" y1="730" x2="443" y2="730" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="451" y="734" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">绿 · 放行</text>
  <line x1="542" y1="730" x2="570" y2="730" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="578" y="734" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">灰虚 · 判定依据</text>
</svg></body></html>
