<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 490" width="1360" height="490">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif; }</style>
  <rect width="1360" height="490" fill="#ffffff"/>
  <text x="680" y="34" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">目标三步走 —— 从开发域超级个体到价值中心</text>

  <rect x="50" y="64" width="380" height="210" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="70" y="84" width="150" height="26" rx="13" fill="#2563eb"/>
  <text x="145" y="101" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">第一步 · 2027 上半年</text>
  <text x="70" y="146" font-size="15" fill="#111827" text-anchor="start" font-weight="600">开发域全面超级个体化</text>
  <text x="70" y="176" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· 六系统常规需求 100% 经平台交付</text>
  <text x="70" y="200" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· 数字员工绩效看板上线（处理量/准确率/返工率）</text>
  <text x="70" y="224" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· 治理从"零违反"升级为"可量化"</text>

  <path d="M 438,169 L 482,207" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrStep)"/>

  <rect x="490" y="114" width="380" height="210" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="510" y="134" width="96" height="26" rx="13" fill="#ea580c"/>
  <text x="558" y="151" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">第二步 · 中期</text>
  <text x="510" y="196" font-size="15" fill="#111827" text-anchor="start" font-weight="600">从代码流水线到业务线体</text>
  <text x="510" y="226" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· 试点 1-2 条业务全自动线体（报表/数据治理）</text>
  <text x="510" y="250" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· FDE 交付方式：对业务结果负责，不止功能上线</text>
  <text x="510" y="274" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· "治理 + 编排 + 进化"内核复用</text>

  <path d="M 878,219 L 922,257" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrStep)"/>

  <rect x="930" y="164" width="380" height="210" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="950" y="184" width="96" height="26" rx="13" fill="#7c3aed"/>
  <text x="998" y="201" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">第三步 · 远期</text>
  <text x="950" y="246" font-size="15" fill="#111827" text-anchor="start" font-weight="600">本体驱动的端到端流水线</text>
  <text x="950" y="276" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· 知识字典升级为本体语义层（可校验可推理）</text>
  <text x="950" y="300" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· 按端到端业务能力组织数字员工队伍</text>
  <text x="950" y="324" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· "1 人 + n 数字员工"成为团队常态</text>
  <text x="950" y="348" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">· IT 从成本中心 → 价值中心</text>

  <rect x="50" y="404" width="1260" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="680" y="426" font-size="13" fill="#334155" text-anchor="middle" font-weight="600">方向已明（超级个体 = 工作管理权的范式转移） · 路已走通（软件交付域第一个六系统闭环）</text>
  <text x="680" y="447" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">下一站：从代码线体到业务线体，从一个人的超级个体，带出一支超级个体团队</text>

  <defs>
    <marker id="arrStep" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
</svg>
