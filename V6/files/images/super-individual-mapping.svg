<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 530" width="1360" height="530">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif; }</style>
  <rect width="1360" height="530" fill="#ffffff"/>
  <text x="680" y="30" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">「超级个体」理念 → 本项目 Harness 的工程化落地映射</text>

  <rect x="40" y="50" width="560" height="30" rx="6" fill="#2563eb"/>
  <text x="320" y="70" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">常总分享「超级个体」理念</text>
  <rect x="760" y="50" width="560" height="30" rx="6" fill="#16a34a"/>
  <text x="1040" y="70" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">本项目 Harness 落地</text>

  <rect x="40" y="96" width="560" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="320" y="129" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">1 人 + n 个数字员工</text>
  <path d="M 610,124 L 748,124" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrMap)"/>
  <rect x="760" y="96" width="560" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="129" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">1 名开发 + 7 个角色 agent，一人承接六系统交付</text>

  <rect x="40" y="164" width="560" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="320" y="197" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">AI 管理工作，人为 AI 定原则与边界</text>
  <path d="M 610,192 L 748,192" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrMap)"/>
  <rect x="760" y="164" width="560" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="197" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">五阶段链 AI 编排 + 人只握 G1/G2 · 宪法红线物理拦截</text>

  <rect x="40" y="232" width="560" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="320" y="265" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">数字员工 Hire-to-Retire 全生命周期</text>
  <path d="M 610,260 L 748,260" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrMap)"/>
  <rect x="760" y="232" width="560" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="265" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">角色定义 → autopilot 巡检考核 → 连败淘汰 → 晋升培训</text>

  <rect x="40" y="300" width="560" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="320" y="333" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">知识工程化（know-how 库）</text>
  <path d="M 610,328 L 748,328" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrMap)"/>
  <rect x="760" y="300" width="560" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="333" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">docs/ 知识字典 + 8 角色错题本 + 四源采集进化</text>

  <rect x="40" y="368" width="560" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="320" y="401" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">复杂性由 AI 消化，分工压平</text>
  <path d="M 610,396 L 748,396" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrMap)"/>
  <rect x="760" y="368" width="560" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="401" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">治理 + 技能 + 硬约束薄层自研，多 agent CLI 可替换</text>

  <rect x="40" y="436" width="560" height="56" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="320" y="469" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="600">先做一条全自动的"线体"</text>
  <path d="M 610,464 L 748,464" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrMap)"/>
  <rect x="760" y="436" width="560" height="56" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="1040" y="469" font-size="13" fill="#166534" text-anchor="middle" font-weight="600">软件交付线体 · 6 系统连续运转 · 月均 190 个交付单元</text>

  <defs>
    <marker id="arrMap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#16a34a"/></marker>
  </defs>
</svg>
