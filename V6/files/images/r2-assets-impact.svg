<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 540" width="1360" height="540">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif; }</style>
  <rect width="1360" height="540" fill="#ffffff"/>
  <text x="680" y="34" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">制度资产与专业影响力 —— 一图速览</text>

  <rect x="40" y="58" width="640" height="30" rx="6" fill="#eff6ff"/>
  <text x="360" y="78" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">■ 制度资产 —— 可被公司长期复用</text>
  <rect x="720" y="58" width="600" height="30" rx="6" fill="#f0fdf4"/>
  <text x="1020" y="78" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="600">■ 专业影响力 —— 开发模式端到端变革</text>

  <rect x="40" y="100" width="640" height="118" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="168" font-size="52" fill="#2563eb" text-anchor="middle" font-weight="700">4</text>
  <text x="130" y="196" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">套规范库</text>
  <text x="215" y="138" font-size="15" fill="#111827" text-anchor="start" font-weight="600">四套规范 + 治理骨架（结构权威源）</text>
  <text x="215" y="162" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">项目宪法 / 协作总纲 / 审查关卡 / 技术详单</text>
  <text x="215" y="180" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">20+ 模板文件，对齐模式铺设到公司任意仓库</text>

  <rect x="40" y="230" width="640" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="130" y="292" font-size="40" fill="#dc2626" text-anchor="middle" font-weight="700">10 + 6</text>
  <text x="130" y="316" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">条资料 / 项红线</text>
  <text x="215" y="268" font-size="15" fill="#111827" text-anchor="start" font-weight="600">疑难问题库：越用越硬的"错题本"</text>
  <text x="215" y="292" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">已沉淀 10 条疑难资料，6 项晋升全员红线</text>
  <text x="215" y="310" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">同类教训第 2 次出现自动晋升（必经人类确认）</text>

  <rect x="40" y="360" width="640" height="118" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="130" y="424" font-size="40" fill="#7c3aed" text-anchor="middle" font-weight="700">6 + 18</text>
  <text x="130" y="448" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">篇文档 / 张图</text>
  <text x="215" y="398" font-size="15" fill="#111827" text-anchor="start" font-weight="600">四代演进全部留档</text>
  <text x="215" y="422" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">架构文档 6 篇（V1→V2→Agent Team→Multica）</text>
  <text x="215" y="440" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400">架构图 18 张，SVG+PNG 双格式</text>
  <text x="215" y="458" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="400">新人培训与跨团队复制有完整材料</text>

  <rect x="720" y="100" width="600" height="118" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="1020" y="136" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">开发模式变革：人写码·人审查 → AI 执行·人决策</text>
  <rect x="745" y="152" width="230" height="48" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="860" y="172" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">以前：人从头干到尾</text>
  <text x="860" y="190" font-size="11" fill="#9ca3af" text-anchor="middle" font-weight="400">按天排期 · 经验难沉淀</text>
  <path d="M 983,176 L 1033,176" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <rect x="1040" y="152" width="258" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1169" y="172" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="600">现在：AI 流水线执行</text>
  <text x="1169" y="190" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="400">人只审两道关</text>

  <rect x="720" y="230" width="600" height="118" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1020" y="264" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">方法论沉淀，公司相关团队可直接借鉴</text>
  <text x="840" y="296" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="600">Prompt</text>
  <text x="840" y="314" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">跟 AI 说什么</text>
  <path d="M 890,296 L 930,296" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <text x="975" y="296" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="600">Context</text>
  <text x="975" y="314" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">AI 该知道什么</text>
  <path d="M 1025,296 L 1065,296" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrOrange)"/>
  <text x="1115" y="296" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="600">Harness</text>
  <text x="1115" y="314" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">用制度管住 AI</text>
  <text x="1235" y="296" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">三次范式跃迁</text>
  <text x="1235" y="314" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">+ 证据链分析纪律</text>

  <rect x="720" y="360" width="600" height="118" rx="10" fill="#cffafe" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="1020" y="396" font-size="15" fill="#111827" text-anchor="middle" font-weight="600">多 CLI 适配，不为单一工具绑定</text>
  <text x="1020" y="424" font-size="13" fill="#0891b2" text-anchor="middle" font-weight="600">多款 agent CLI 已完成适配验证，可按需替换</text>
  <text x="1020" y="448" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400">为公司后续工具链选型保留灵活性、降低绑定风险</text>

  <defs>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  </defs>
</svg>
