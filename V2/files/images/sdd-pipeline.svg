  <text x="890.0" y="402" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Exhaustive 三档</text>
  <rect x="1020" y="346" width="160" height="72" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
