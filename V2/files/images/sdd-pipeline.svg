  <rect width="1240" height="790" fill="#ffffff"/>
  <text x="620.0" y="32" font-size="19" fill="#111827" text-anchor="middle" font-weight="600">SDD 实现 · OpenSpec 工件链与强制机制</text>
  <text x="620.0" y="56" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">先 WHAT 后 HOW（顺序铁律）· 双 strict 强制 · 三件套人工执行 · 规格与实现单态同步</text>
  <text x="90" y="96" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="400">工件属性 →</text>
