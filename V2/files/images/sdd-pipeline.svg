  <text x="600.0" y="387" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">按 plan.md 逐条推进（红-绿-重构）</text>
  <text x="600.0" y="402" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">DDL 变更后 db-schema-export 重生成库文档</text>
