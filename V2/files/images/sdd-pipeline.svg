  <rect x="106" y="504" width="304" height="94" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="258.0" y="530" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">ordering · strict</text>
  <text x="258.0" y="547" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">工件跳序 / 先码后文 → 直接 block</text>
  <text x="258.0" y="562" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400"></text>
  <text x="258.0" y="577" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">tdd_enforcement · strict</text>
  <text x="258.0" y="592" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">不写测试不让过（门禁化）</text>
  <rect x="466" y="470" width="336" height="146" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="482" y="490" font-size="12" fill="#374151" text-anchor="start" font-weight="600">模型分级路由（model_routing_hints）</text>
  <rect x="482" y="504" width="304" height="94" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="634.0" y="530" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">按工序路由模型</text>
  <text x="634.0" y="547" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">explore 澄清 → 小模型（省）</text>
  <text x="634.0" y="562" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">design / review → 大模型（准）</text>
  <text x="634.0" y="577" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">apply 编码 → 中档（均衡）</text>
  <rect x="842" y="470" width="336" height="146" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6,4"/>
