  <rect x="858" y="504" width="304" height="94" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1010.0" y="530" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">docs/ 唯一权威源</text>
  <text x="1010.0" y="547" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">第一道：变更随行（DDL 后重生成）</text>
  <text x="1010.0" y="562" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">第二道：周一 harness-audit 对账</text>
  <text x="1010.0" y="577" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="400">diff→文档增量 MR · 无差异静默</text>
  <rect x="90" y="640" width="1090" height="52" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="635" y="662" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">闭环：归档时 sync-specs 将实现反哺回 specs —— 规格与实现永远单态，杜绝"文档是文档、代码是代码"</text>
  <text x="635" y="682" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">消费端：全角色开工必读四工件（工件链驱动），CLAUDE.md / AGENTS.md 为项目事实唯一权威源</text>
