  <rect x="90" y="212" width="1090" height="92" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="635" y="236" font-size="13.5" fill="#9a3412" text-anchor="middle" font-weight="600">人工门 G1 —— 第一道人工关口（写库 SQL 永不由 agent 执行）</text>
  <text x="635" y="258" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">人审四工件（proposal / specs / design / api） · 人工执行 ddl.sql + auth-resource.sql（三件套 = design + ddl + auth）</text>
  <text x="635" y="278" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="400">回执 @Mika → 置 metadata（ddl_done / role_bind）→ 解锁 stage ≥2（表结构先存在，TDD 才有可依赖的测试对象）</text>
