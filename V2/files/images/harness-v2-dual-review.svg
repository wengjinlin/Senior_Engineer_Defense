<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<style>
text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif; }
</style>
<defs>
<marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
<marker id="arrg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="arro" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/></filter>
</defs>
<rect width="800" height="500" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" fill="#111827" font-size="18" font-weight="600">双轨审查 — 自动路由机制</text>
<rect x="300" y="50" width="200" height="44" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
<text x="400" y="77" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="600">进入审查阶段</text>
<line x1="400" y1="94" x2="400" y2="118" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="200" y="120" width="400" height="56" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" filter="url(#sh)"/>
<text x="400" y="142" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">分析变更特征</text>
<text x="400" y="162" text-anchor="middle" fill="#6b7280" font-size="11">task 数量 | 模块数 | DDL 变更 | 跨服务</text>
<line x1="400" y1="176" x2="400" y2="200" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="400,200 520,250 400,300 280,250" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
<text x="400" y="244" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">task&lt;=3</text>
<text x="400" y="260" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">单模块 无DDL</text>
<line x1="280" y1="250" x2="160" y2="310" stroke="#16a34a" stroke-width="2" marker-end="url(#arrg)"/>
<text x="200" y="280" fill="#16a34a" font-size="12" font-weight="600">是</text>
<line x1="520" y1="250" x2="640" y2="310" stroke="#ea580c" stroke-width="2" marker-end="url(#arro)"/>
<text x="590" y="280" fill="#ea580c" font-size="12" font-weight="600">否</text>
<rect x="40" y="314" width="250" height="160" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
<text x="165" y="338" text-anchor="middle" fill="#15803d" font-size="14" font-weight="600">quick-review</text>
<text x="165" y="356" text-anchor="middle" fill="#22c55e" font-size="12">轻量 3 关 | ~3 分钟</text>
<rect x="60" y="368" width="210" height="26" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="90" y="385" fill="#15803d" font-size="11" font-weight="600">第 1 关</text>
<text x="180" y="385" fill="#166534" font-size="11">spec-align</text>
<rect x="60" y="402" width="210" height="26" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="90" y="419" fill="#15803d" font-size="11" font-weight="600">第 2 关</text>
<text x="180" y="419" fill="#166534" font-size="11">risk-check</text>
<rect x="60" y="436" width="210" height="26" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="90" y="453" fill="#15803d" font-size="11" font-weight="600">第 3 关</text>
<text x="180" y="453" fill="#166534" font-size="11">archive</text>
<line x1="165" y1="394" x2="165" y2="402" stroke="#86efac" stroke-width="1" marker-end="url(#arrg)"/>
<line x1="165" y1="428" x2="165" y2="436" stroke="#86efac" stroke-width="1" marker-end="url(#arrg)"/>
<rect x="510" y="314" width="250" height="160" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
<text x="635" y="338" text-anchor="middle" fill="#c2410c" font-size="14" font-weight="600">gstack</text>
<text x="635" y="356" text-anchor="middle" fill="#ea580c" font-size="12">完整 9 关 | ~10-15 分钟</text>
<rect x="530" y="368" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="563" y="385" text-anchor="middle" fill="#9a3412" font-size="9">1.verify</text>
<rect x="603" y="368" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="636" y="385" text-anchor="middle" fill="#9a3412" font-size="9">2.review</text>
<rect x="676" y="368" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="709" y="385" text-anchor="middle" fill="#9a3412" font-size="9">3.spring</text>
<rect x="530" y="402" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="563" y="419" text-anchor="middle" fill="#9a3412" font-size="9">4.sql</text>
<rect x="603" y="402" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="636" y="419" text-anchor="middle" fill="#9a3412" font-size="9">5.security</text>
<rect x="676" y="402" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="709" y="419" text-anchor="middle" fill="#9a3412" font-size="9">6.simplify</text>
<rect x="530" y="436" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="563" y="453" text-anchor="middle" fill="#9a3412" font-size="9">7.qa</text>
<rect x="603" y="436" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="636" y="453" text-anchor="middle" fill="#9a3412" font-size="9">8.PR</text>
<rect x="676" y="436" width="67" height="26" rx="3" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
<text x="709" y="453" text-anchor="middle" fill="#9a3412" font-size="9">9.archive</text>
<text x="165" y="490" text-anchor="middle" fill="#9ca3af" font-size="10">适用：日常 CRUD / 字段变更 / Bug 修复（约 70-80% 场景）</text>
<text x="635" y="490" text-anchor="middle" fill="#9ca3af" font-size="10">适用：新模块 / 跨模块 / DDL 变更（约 20-30% 场景）</text>
</svg>