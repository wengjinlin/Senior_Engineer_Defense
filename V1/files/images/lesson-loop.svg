<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 580" width="1360" height="580">
  <style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif; }</style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1360" height="580" fill="#ffffff"/>
  <text x="680" y="30" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">AI 自我学习闭环 —— 从踩坑到宪法</text>
  <rect x="60" y="100" width="220" height="100" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="170.0" y="124" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">① 干活踩坑</text>
  <text x="170.0" y="143" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Reviewer 打回</text>
  <text x="170.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Tester 测试踩坑</text>
  <text x="170.0" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">发布翻车 / 人工测试警告</text>
  <rect x="304" y="100" width="220" height="100" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="414.0" y="124" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">② 归因提炼</text>
  <text x="414.0" y="143" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Mika 巡检：连打回≥2</text>
  <text x="414.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">周级复盘：四源证据归因</text>
  <text x="414.0" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">REVIEW 关 3：新教训即记</text>
  <rect x="548" y="100" width="220" height="100" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="658.0" y="124" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">③ lesson 条目</text>
  <text x="658.0" y="143" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">[日期][change-id] 标题</text>
  <text x="658.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">❌ 错误做法（具体到命令）</text>
  <text x="658.0" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">✅ 正确做法（具体可执行）</text>
  <rect x="792" y="100" width="220" height="100" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="902.0" y="124" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">④ 人审入库</text>
  <text x="902.0" y="143" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">retro MR 人审合并</text>
  <text x="902.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">DevOps 归档时落盘</text>
  <text x="902.0" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">docs/lessons/{Role}.md</text>
  <rect x="1036" y="100" width="220" height="100" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1146.0" y="124" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">⑤ 开工必读</text>
  <text x="1146.0" y="143" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">先读自己角色经验库</text>
  <text x="1146.0" y="159" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">历史教训</text>
  <text x="1146.0" y="175" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">视同本级约束执行</text>
  <path d="M 282,150 L 302,150" fill="none" stroke="blue" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 526,150 L 546,150" fill="none" stroke="blue" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 770,150 L 790,150" fill="none" stroke="blue" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 1014,150 L 1034,150" fill="none" stroke="blue" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 1146,94 C 950,44 390,44 178,94" fill="none" stroke="blue" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="662" y="48" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">开工即带上全部历史记忆 —— AI 越干越聪明</text>
  <path d="M 902,200 L 902,336" fill="none" stroke="blue" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <polygon points="902,340 1052,380 902,420 752,380" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="902" y="376" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">同类教训</text>
  <text x="902" y="392" font-size="11" fill="#111827" text-anchor="middle" font-weight="400">第 2 次出现？</text>
  <text x="1058" y="368" font-size="11" fill="#ea580c" text-anchor="start" font-weight="400">是</text>
  <path d="M 1054,380 L 1066,380" fill="none" stroke="orange" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="1070" y="345" width="264" height="70" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1202.0" y="369" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Reviewer 标注「建议晋升」</text>
  <text x="1202.0" y="388" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">@Mika 转人类确认</text>
  <path d="M 1202,415 L 1202,441" fill="none" stroke="orange" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="1070" y="445" width="264" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1202.0" y="469" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">晋升宪法（制度红线）</text>
  <text x="1202.0" y="488" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">写入 CLAUDE.md / REVIEW.md</text>
  <text x="1202.0" y="504" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">原 lesson 条目删除</text>
  <text x="742" y="370" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">否</text>
  <path d="M 752,380 L 658,380 L 658,204" fill="none" stroke="gray" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="705" y="398" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">继续作为经验生效</text>
  <text x="680" y="556" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="400">两级进化：角色经验库 docs/lessons/{Role}.md（越攒越厚）→ 全员制度红线 CLAUDE.md / REVIEW.md（越用越硬）· 每次晋升必经人类确认</text>
</svg>