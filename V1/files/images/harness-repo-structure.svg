  <text x="228.0" y="501" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">涉平台集成需求必读 · 全角色</text>
  <rect x="413" y="442" width="344" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="585.0" y="466" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">lessons/（index + {Role}.md）</text>
