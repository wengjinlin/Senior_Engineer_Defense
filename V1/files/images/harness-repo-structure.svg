  <text x="585.0" y="411" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">宪法红线与详单两向引用</text>
  <rect x="770" y="352" width="344" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
