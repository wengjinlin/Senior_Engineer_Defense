  <text x="942.0" y="155" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">full 10 关 · protected 路径加人工复核</text>
  <text x="56" y="196" font-size="12" fill="#374151" text-anchor="start" font-weight="600">② docs/ 字典体系（唯一权威源）—— docs/index.md 是唯一入口</text>
