  <text x="942.0" y="501" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">人类维护 · agent 只读 · 复盘归档</text>
  <text x="56" y="548" font-size="12" fill="#374151" text-anchor="start" font-weight="600">③ 机制层（硬约束 —— 不靠自觉靠拦截）</text>
