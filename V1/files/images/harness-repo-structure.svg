  <text x="228.0" y="139" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">15 节红线：定位/模块表/构建/TDD/分层</text>
  <text x="228.0" y="155" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">命名/保护路径/响应格式/日志——覆盖全仓库</text>
  <rect x="413" y="96" width="344" height="76" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
