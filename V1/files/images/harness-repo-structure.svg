  <text x="585.0" y="155" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">变更联动矩阵 · lessons 读写矩阵</text>
  <rect x="770" y="96" width="344" height="76" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
