  <rect width="1420" height="900" fill="#ffffff"/>
  <text x="710" y="34" font-size="20" fill="#111827" text-anchor="middle" font-weight="600">目标仓库 harness 结构图 —— agent 的制度与字典</text>
  <text x="710" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">三大治理文档（红线）+ docs/ 字典体系（唯一权威源）+ 机制硬约束 + 一次性建设 + 双重防漂移</text>
  <text x="56" y="84" font-size="12" fill="#374151" text-anchor="start" font-weight="600">① 治理文档（红线层）—— 所有 agent 开工必读，违反即打回</text>
