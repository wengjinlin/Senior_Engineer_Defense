  <text x="942.0" y="321" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">业务校验铁律 · PM 为主</text>
  <rect x="56" y="352" width="344" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="228.0" y="376" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">database/（index + tables/）</text>
  <text x="228.0" y="395" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">全库表清单 + 每表字段详情</text>
  <text x="228.0" y="411" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">唯一生成通道 aicoding-db-schema-export</text>
  <rect x="413" y="352" width="344" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="585.0" y="376" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">standards/（api · database · testing）</text>
